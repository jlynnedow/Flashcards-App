<article>
   <h4>{{ card.question }}</h4>
   {% if not check_card %}
      <p>{{ card.answer }}</p>
      <a href="{% url 'card-update' card.id %}" role="button">
         Edit Card
      </a>
   {% else %}
   {% include "cards/card_check_form.html" with solved=True %}
   {% endif %}
</article>
<style>
   article{
      background-color: #a3b18a;
   }
</style>
