<!DOCTYPE html>
<html lang="en">

<head>
    <title>Flashcards</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>

<style>
    /* Custom CSS */

    :root {
        --accent: #2f3e46;
        --accent-bg: #a3b18a;
        --bg: #cad2c5;
        --text: #2f3e46;
        --text-light: #354f52;
        --border: #2f3e46;
        --code: #d81b60;
        --preformatted: #444;
    }

    article {
        background-color: var(--marked);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1em;
        margin: 1em 0;
    }

    h2 {
        text-align: center;
    }

    h2, h4 {
        margin-top: 0;
    }

    hr {
        background: var(--accent);
        border-color: var(--accent);
    }

    button,
    a[role="button"] {
        color: #3a5a40;
        text-decoration: none;
    }

    input, select, textarea {
        width: 100%;
    }
</style>

<body>
    <header>
        <h1>(Not) Quizlet</h1>
        {% include "cards/navigation.html" %}
        <text>
            This study tool is free and works very differently from quizlet learn.
        <text>
    </header>
    <main>
        {% block content %}
            <h2>(Not) Quizlet</h2>
        {% endblock content %}
    </main>
</body>

</html>
